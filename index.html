<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Control de Pesajes</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="contenedor">

    <header>

        <h1>CONTROL DE PESAJES</h1>

        <div id="fecha"></div>

    </header>

    <section id="formulario">

        <div class="grupo">

            <label for="numero">N° Pesaje</label>

            <input
                type="text"
                id="numero"
                readonly>

        </div>

        <div class="grupo">

            <label for="envase">Envase</label>

            <input
                type="text"
                id="envase"
                placeholder="Ej. Balde Blanco"
                autocomplete="off">

        </div>

        <div class="grupo">

            <label for="neto">Peso Neto (g)</label>

            <input
                type="number"
                id="neto"
                inputmode="decimal"
                placeholder="0"
                autocomplete="off">

        </div>

        <div class="grupo">

            <label for="tara">Tara (g)</label>

            <div class="tara-container">

                <input
                    type="number"
                    id="tara"
                    inputmode="decimal"
                    placeholder="0"
                    autocomplete="off">

                <button
                    type="button"
                    id="fijarTara"
                    class="pin"
                    title="Fijar tara">

                    📌

                </button>

            </div>

        </div>

        <div class="resultado">

            <span>Peso Producto</span>

            <strong id="producto">

                0 g

            </strong>

        </div>

<button
    type="button"
    id="guardar">

    Guardar Pesaje

</button>

<button
    type="button"
    id="nuevoLote"
    class="secundario">

    Finalizar lote

</button>
    </section>

    <section class="totales">

        <div>

            Neto Total

            <strong id="totalNeto">

                0 g

            </strong>

        </div>

        <div>

            Tara Total

            <strong id="totalTara">

                0 g

            </strong>

        </div>

        <div class="totalProducto">

            Producto Total

            <strong id="totalProducto">

                0 g

            </strong>

        </div>

    </section>

    <section>

        <h2>Pesajes</h2>

        <div id="lista"></div>

    </section>

</div>

<script src="app.js"></script>

</body>

</html>
